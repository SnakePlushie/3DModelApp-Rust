[package]
name = "modelApp"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = { version = "0.30" }
infrastructure = { path = "./src/infrastructure" }
log = { workspace = true }
env_logger = { workspace = true }

[[bin]]
name = "modelApp"

[workspace]
resolver = "3"
members = ["src/infrastructure", "src/domain", "src/application"]

[workspace.dependencies]
log = "0.4"
env_logger = "0.10"
